name: csharp

on:
  push:
    branches: main
    paths:
      - 'csharp/**'
      - 'README.md'
      - '.github/scripts/*csharp*'
      - '.github/scripts/*nuget-*'
      - '.github/workflows/csharp.yml'
  pull_request:
    branches: main
    paths:
      - 'csharp/**'
      - 'README.md'
      - '.github/scripts/*csharp*'
      - '.github/scripts/*nuget-*'
      - '.github/workflows/csharp.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main finish so a
  # release or documentation push that already started is never interrupted.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

defaults:
  run:
    working-directory: csharp

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate tests and NuGet package
        run: ../.github/scripts/validate-csharp-package.sh

      - name: Validate bilingual C# API documentation
        run: |
          python3 ../.github/scripts/check-csharp-docs.test.py
          python3 ../.github/scripts/check-csharp-docs.py Platform.Interfaces/bin/Release/net8/Platform.Interfaces.xml

      - name: Test C# workflow safeguards
        run: node --test ../.github/scripts/*csharp*.test.mjs ../.github/scripts/*nuget-*.test.mjs

  releasePreflight:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publishRequired: ${{ steps.preflight.outputs.publish_required }}
      auth: ${{ steps.preflight.outputs.auth }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check release state and credentials
        id: preflight
        env:
          CSPROJ: Platform.Interfaces/Platform.Interfaces.csproj
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: node ../.github/scripts/preflight-nuget-release.mjs

  pushNuGetPackageToGitHubPackageRegistry:
    needs: [test, releasePreflight]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Pack NuGet package
        run: dotnet pack Platform.Interfaces/Platform.Interfaces.csproj --configuration Release --output "$RUNNER_TEMP/github-packages" --nologo -warnaserror

      - name: Add GitHub NuGet source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget add source https://nuget.pkg.github.com/linksplatform/index.json --name GitHub --username linksplatform --password "$GITHUB_TOKEN" --store-password-in-clear-text

      # GitHub Packages authenticates with GITHUB_TOKEN; trusted publishing is
      # a nuget.org feature, so zizmor's suggestion does not apply here.
      - name: Push NuGet package to GitHub Package Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "$RUNNER_TEMP/github-packages"/*.nupkg --source GitHub --api-key "$GITHUB_TOKEN" --skip-duplicate # zizmor: ignore[use-trusted-publishing]

  pushToNuget:
    needs: [test, releasePreflight]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Pack NuGet package
        run: dotnet pack Platform.Interfaces/Platform.Interfaces.csproj --configuration Release --output "$RUNNER_TEMP/nuget-packages" --nologo -warnaserror

      - name: Log in to NuGet with trusted publishing
        id: nuget-login
        if: ${{ needs.releasePreflight.outputs.auth == 'trusted-publishing' && needs.releasePreflight.outputs.publishRequired == 'true' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push NuGet package to NuGet.org
        env:
          AUTH: ${{ needs.releasePreflight.outputs.auth }}
          PUBLISH_REQUIRED: ${{ needs.releasePreflight.outputs.publishRequired }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_TOKEN }}
        run: ../.github/scripts/push-nuget-package.sh "$RUNNER_TEMP/nuget-packages"/*.nupkg

  publishRelease:
    needs: [pushNuGetPackageToGitHubPackageRegistry, pushToNuget]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          project=Platform.Interfaces/Platform.Interfaces.csproj
          version=$(dotnet msbuild "$project" -nologo -getProperty:VersionPrefix)
          release_notes=$(dotnet msbuild "$project" -nologo -getProperty:PackageReleaseNotes)
          tag="csharp_${version}"
          title="[C#] ${version}"
          package_url="https://www.nuget.org/packages/Platform.Interfaces/${version}"
          notes="${package_url}"$'\n\n'"${release_notes}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          fi

  findChangedCsFiles:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      documentationChanged: ${{ steps.detect.outputs.documentationChanged }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # git diff replaces tj-actions/changed-files, which was compromised in
      # March 2025 (CVE-2025-30066) and was referenced by a mutable tag.
      - name: Detect documentation inputs
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed_files=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          else
            echo "No base commit to compare with; treating documentation inputs as changed."
            changed_files=README.md
          fi
          if [ "${RUNNER_DEBUG:-}" = 1 ]; then
            printf 'Changed files:\n%s\n' "$changed_files"
          fi
          documentation_changed=false
          for changed_file in $changed_files; do
            case "$changed_file" in
              *.cs|README.md|.github/workflows/csharp.yml|.github/scripts/*csharp*|csharp/docfx.json|csharp/filter.yml|csharp/toc.yml)
                documentation_changed=true
                ;;
            esac
          done
          echo "documentationChanged=${documentation_changed}" >> "$GITHUB_OUTPUT"
          echo "Documentation inputs changed: ${documentation_changed}"

  generatePdfWithCode:
    needs: [findChangedCsFiles]
    if: ${{ needs.findChangedCsFiles.outputs.documentationChanged == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - name: Generate PDF with code
        run: ../.github/scripts/generate-csharp-pdf.sh

      - name: Upload generated PDF
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: csharp-pdf
          path: csharp/_site/Platform.Interfaces.pdf
          if-no-files-found: error
          retention-days: 1

  buildDocumentation:
    needs: [findChangedCsFiles]
    if: ${{ needs.findChangedCsFiles.outputs.documentationChanged == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build API documentation
        run: |
          dotnet tool install docfx --tool-path "$RUNNER_TEMP/docfx" --version 2.80.1
          "$RUNNER_TEMP/docfx/docfx" docfx.json --warningsAsErrors
          cp _site/README.html _site/index.html

      - name: Validate documentation output
        run: ../.github/scripts/validate-csharp-docs.sh _site

      - name: Upload documentation site
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: csharp-documentation
          path: csharp/_site
          if-no-files-found: error
          retention-days: 1

  publishDocumentation:
    needs: [findChangedCsFiles, generatePdfWithCode, buildDocumentation]
    if: ${{ needs.findChangedCsFiles.outputs.documentationChanged == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download documentation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name csharp-documentation --dir _site
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name csharp-pdf --dir _site

      - name: Validate documentation site
        run: |
          ../.github/scripts/validate-csharp-docs.sh _site
          test -s _site/Platform.Interfaces.pdf

      - name: Publish documentation to gh-pages
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ../.github/scripts/publish-csharp-docs.sh _site

  pipelineStatus:
    needs:
      - test
      - releasePreflight
      - pushNuGetPackageToGitHubPackageRegistry
      - pushToNuget
      - publishRelease
      - findChangedCsFiles
      - generatePdfWithCode
      - buildDocumentation
      - publishDocumentation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          DOCUMENTATION_CHANGED: ${{ needs.findChangedCsFiles.outputs.documentationChanged }}
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node ../.github/scripts/check-csharp-pipeline-status.mjs
