name: Secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  secretlint:
    name: Scan for committed secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Also covers the CI logs kept under dev/log. The scan is proven able to
      # fail by experiments/secretlint-detects-planted-secret.sh.
      - name: Check for secrets
        run: >-
          npx --yes
          -p secretlint@13.0.7
          -p @secretlint/secretlint-rule-preset-recommend@13.0.7
          secretlint "**/*"
