name: Check README badges

on:
  push:
    branches:
      - 'main'
    paths:
      - 'README.md'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'README.md'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main finish so a
  # release or documentation push that already started is never interrupted.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test the badge check
        run: node --test .github/scripts/check-readme-badges.test.mjs
      - name: Check that README badges reference existing workflows
        run: node .github/scripts/check-readme-badges.mjs --verbose
