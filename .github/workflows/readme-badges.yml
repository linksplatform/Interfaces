name: Check README badges

on:
  push:
    branches:
      - 'main'
    paths:
      - 'README.md'
      - '.github/workflows/**'
      - '.github/scripts/check-readme-badges.mjs'
  pull_request:
    paths:
      - 'README.md'
      - '.github/workflows/**'
      - '.github/scripts/check-readme-badges.mjs'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check that README badges reference existing workflows
        run: node .github/scripts/check-readme-badges.mjs --verbose
